<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101419">
  <title>Guitar Tools</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <header class="topbar">
    <a class="brand" href="#/tuning" aria-label="Guitar Tools home"><span class="brandmark" aria-hidden="true">♫</span><strong>Guitar<span>Tools</span></strong></a>
    <nav aria-label="Main navigation">
      <a href="#/tuning" data-route="tuning">Tuning Library</a>
      <a href="#/library" data-route="library">Song Library</a>
      <a href="#/player" data-route="player">Tab Player</a>
    </nav>
    <span class="workspace-label">GUITAR WORKSPACE</span>
  </header>
  <main id="workspace" tabindex="-1"></main>
  <noscript>This workspace needs JavaScript enabled to navigate and play scores.</noscript>
  <footer class="app-footer"><span>Guitar Tools · Application foundation</span><span>alphaTab: MPL-2.0 · Bravura: SIL OFL · Sonivox: Apache-2.0 · <a href="./assets/vendor/README.md">Vendor notices</a></span></footer>
  <template id="player-template">

  <p class="eyebrow">Practice / Guitar Pro reader</p>
  <h1 id="player-title" tabindex="-1">Tab Player</h1>
  <p>Open a Guitar Pro file or try the original exercise. Files stay in memory for this tab; nothing is uploaded or saved.</p>
  <section aria-label="Load score" class="controls">
    <label>Guitar Pro file (max 20 MiB)<input id="file" type="file" accept=".gp3,.gp4,.gp5,.gpx,.gp"></label>
    <button id="sample">Load original exercise</button>
    <button id="pitch-sample">Load E4 pitch reference</button>
  </section>
  <p id="status" role="status">Loading local SDK…</p>
  <p id="error" role="alert" hidden></p>
  <p id="metadata"></p>
  <section class="controls" aria-label="Layout">
    <label>Layout<select id="layout"><option value="page">Page</option><option value="horizontal">Horizontal</option></select></label>
    <label>Bars per row<select id="bars"><option>2</option><option>3</option><option>4</option><option value="-1">Auto</option></select></label>
    <label>Zoom <output id="zoom-value">100%</output><input id="zoom" type="range" min="50" max="150" step="10" value="100"></label>
  </section>
  <section aria-label="Playback" class="controls">
    <button id="audio">Enable audio / retry</button>
    <button id="play" disabled>Play / pause</button>
    <button id="stop" disabled>Stop</button>
    <label>Speed<select id="speed"><option value="50">50%</option><option value="75">75%</option><option value="100" selected>100%</option><option value="125">125%</option><option value="150">150%</option></select></label>
    <label>Playback pitch<select id="pitch" aria-describedby="pitch-help"></select></label>
    <button id="reset-pitch">Reset pitch</button>
    <label class="seek">Seek<input id="seek" type="range" min="0" max="1" step="1" value="0" disabled></label>
    <output id="time">0:00 / 0:00</output>
    <output id="tempo">Score tempo: —</output>
  </section>
  <p id="pitch-help">Pitch shifts safe melodic MIDI channels only. Original staff, TAB and fingerings stay unchanged. Percussion is excluded.</p>
  <section class="controls" aria-label="Loop">
    <label>Loop start<select id="loop-start"></select></label>
    <label>Loop end<select id="loop-end"></select></label>
    <label><input id="loop" type="checkbox"> Loop selected occurrences</label>
  </section>
  <p class="hint">Loop labels follow playback order, including repeats. You can also click the score to seek or drag to select a range.</p>
  <section aria-label="Track controls">
    <h2>Tracks</h2>
    <div class="table-scroll">
      <table>
        <thead>
        <tr><th>Track / tuning (low → high)</th><th>Visible</th><th>Mute</th><th>Solo</th></tr>
        </thead>
        <tbody id="tracks"></tbody>
      </table>
    </div>
    <p id="channels"></p>
  </section>
  <div id="score-scroll" tabindex="0" role="region" aria-label="Scrollable notation and TAB"><div id="score"></div></div>
  <section aria-label="Fretboard diagnostics">
    <h2>Original fingering diagnostic</h2>
    <label>Track<select id="fret-track"></select></label>
    <p>Gray: source measure. Yellow: current beat positions, including chords. Beat highlights are not a sample-accurate sustain detector.</p>
    <div id="fretboard" class="table-scroll"></div>
    <pre id="diagnostic">Waiting for score…</pre>
  </section>
  <details><summary>Event log</summary><pre id="log"></pre></details>

  </template>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
